name: Negoshi content pipeline

on:
  schedule:
    - cron: "*/20 * * * *" # backup; Vercel cron also dispatches hourly (app/api/cron/pipeline)
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run (fetch sources, no Claude calls, nothing written)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run pipeline
        run: node scripts/pipeline.mjs ${{ inputs.dry && '--dry' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated briefs
        if: ${{ !inputs.dry }}
        run: |
          git config user.name "negoshi-bot"
          git config user.email "bot@negoshi.news"
          git add data/items.json data/seen.json
          git diff --cached --quiet || git commit -m "pipeline: new briefs $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push
