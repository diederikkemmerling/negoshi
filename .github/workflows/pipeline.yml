name: Negoshi content pipeline

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/pipeline.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated briefs
        run: |
          git config user.name "negoshi-bot"
          git config user.email "bot@negoshi.news"
          git add data/items.json
          git diff --cached --quiet || git commit -m "pipeline: new briefs $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
